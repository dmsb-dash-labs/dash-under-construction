<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DASH Lab — Coming Soon</title>
<meta name="description" content="DMSB AI Strategic Hub · Northeastern University">
<style>
  :root{
    --bg:#03040a;
    --accent:#5eead4;
    --accent2:#818cf8;
    --accent3:#f472b6;
    --fg:#e7ecf7;
    --fg-dim:#7b8399;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
  }

  canvas#net{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(94,234,212,0.06), transparent 55%),
      radial-gradient(ellipse at 120% 120%, rgba(129,140,248,0.10), transparent 60%),
      radial-gradient(ellipse at -20% -10%, rgba(244,114,182,0.08), transparent 55%),
      radial-gradient(circle at center, transparent 40%, rgba(2,3,8,0.75) 100%);
    z-index:1;
  }

  .grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.035;
    z-index:2;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
  }

  .content{
    position:relative;
    z-index:3;
    text-align:center;
    padding:0 24px;
    max-width:900px;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--fg-dim);
    opacity:0;
    transform:translateY(10px);
    animation:fadeUp 1s cubic-bezier(.16,1,.3,1) 0.15s forwards;
    margin-bottom:28px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px 2px rgba(94,234,212,0.7);
    animation:pulse 2.4s ease-in-out infinite;
  }

  h1{
    font-size:clamp(3.2rem, 11vw, 8rem);
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:0.95;
    color:var(--fg);
    opacity:0;
    transform:translateY(24px);
    animation:fadeUp 1.1s cubic-bezier(.16,1,.3,1) 0.35s forwards;
    background:linear-gradient(180deg, #ffffff 0%, #d7ddee 55%, #8b93ad 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    position:relative;
    filter:drop-shadow(0 0 40px rgba(129,140,248,0.15));
  }
  h1 .accent-dot{
    color:var(--accent);
    -webkit-text-fill-color:var(--accent);
  }

  .subtitle{
    margin-top:22px;
    font-size:clamp(0.85rem, 2vw, 1.05rem);
    letter-spacing:0.08em;
    color:var(--fg-dim);
    font-weight:500;
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp 1s cubic-bezier(.16,1,.3,1) 0.6s forwards;
  }

  .divider{
    width:64px;height:1px;
    margin:36px auto;
    background:linear-gradient(90deg, transparent, var(--accent2), transparent);
    opacity:0;
    animation:fadeIn 1.2s ease 0.85s forwards;
  }

  .coming-soon{
    font-size:clamp(1.6rem, 4vw, 2.4rem);
    font-weight:300;
    letter-spacing:0.06em;
    color:transparent;
    background:linear-gradient(100deg,
      #aab2c8 0%, #aab2c8 40%,
      #ffffff 50%,
      #aab2c8 60%, #aab2c8 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    animation:shimmer 3.2s linear infinite, fadeUp 1s cubic-bezier(.16,1,.3,1) 1s forwards;
    opacity:0;
    transform:translateY(16px);
  }

  .flavor{
    margin-top:30px;
    font-size:clamp(0.82rem, 1.6vw, 0.95rem);
    color:var(--fg-dim);
    font-weight:400;
    letter-spacing:0.01em;
    line-height:1.7;
    opacity:0;
    transform:translateY(14px);
    animation:fadeUp 1s cubic-bezier(.16,1,.3,1) 1.2s forwards;
  }

  .footer{
    position:fixed;
    bottom:28px;
    left:0;right:0;
    text-align:center;
    z-index:3;
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#454d63;
    opacity:0;
    animation:fadeIn 1.2s ease 1.5s forwards;
  }

  @keyframes fadeUp{
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes fadeIn{
    to{opacity:1;}
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.4;transform:scale(0.7);}
  }
  @keyframes shimmer{
    to{background-position:-220% 0;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<canvas id="net"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="content">
  <div class="eyebrow"><span class="dot"></span>Northeastern University · D'Amore-McKim School of Business</div>
  <h1>DASH<span class="accent-dot">.</span>Lab</h1>
  <div class="subtitle">DMSB AI Strategic Hub</div>
  <div class="divider"></div>
  <div class="coming-soon">Coming Soon</div>
  <p class="flavor">Building the frontier of applied AI research — where business intelligence meets machine intelligence.</p>
</div>

<div class="footer">© 2026 DASH Lab — Northeastern University</div>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var w, h, dpr;
  var nodes = [];
  var mouse = { x: null, y: null };

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    initNodes();
  }

  function initNodes(){
    var area = w * h;
    var count = Math.max(28, Math.min(90, Math.floor(area / 22000)));
    nodes = [];
    for(var i=0;i<count;i++){
      nodes.push({
        x: Math.random()*w,
        y: Math.random()*h,
        vx: (Math.random()-0.5)*0.18,
        vy: (Math.random()-0.5)*0.18,
        r: Math.random()*1.6 + 0.6
      });
    }
  }

  var linkDist = 150;
  var colors = ['94,234,212','129,140,248','244,114,182'];

  function step(){
    ctx.clearRect(0,0,w,h);

    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      n.x += n.vx;
      n.y += n.vy;
      if(n.x < -20) n.x = w+20;
      if(n.x > w+20) n.x = -20;
      if(n.y < -20) n.y = h+20;
      if(n.y > h+20) n.y = -20;
    }

    for(var i=0;i<nodes.length;i++){
      for(var j=i+1;j<nodes.length;j++){
        var a = nodes[i], b = nodes[j];
        var dx = a.x-b.x, dy = a.y-b.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < linkDist){
          var op = (1 - dist/linkDist) * 0.16;
          ctx.strokeStyle = 'rgba(129,140,248,' + op + ')';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }

    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      var c = colors[i % colors.length];
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(' + c + ',0.55)';
      ctx.shadowColor = 'rgba(' + c + ',0.9)';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(step);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(step);
})();
</script>

</body>
</html>

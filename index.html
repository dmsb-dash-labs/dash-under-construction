<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DASH Lab — Coming Soon</title>
<meta name="description" content="DMSB AI Strategic Hub · Northeastern University">
<style>
  :root{
    --bg:#03040a;
    --accent:#5eead4;
    --accent2:#818cf8;
    --accent3:#f472b6;
    --fg:#e7ecf7;
    --fg-dim:#7b8399;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
  }

  canvas#net{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:0;
  }

  .aurora{
    position:fixed;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    filter:blur(60px);
    opacity:0.55;
  }
  .aurora span{
    position:absolute;
    border-radius:50%;
    mix-blend-mode:screen;
  }
  .aurora span:nth-child(1){
    width:52vw;height:52vw;
    top:-14%;left:-12%;
    background:radial-gradient(circle, rgba(94,234,212,0.35), transparent 70%);
    animation:drift1 26s ease-in-out infinite;
  }
  .aurora span:nth-child(2){
    width:46vw;height:46vw;
    bottom:-16%;right:-10%;
    background:radial-gradient(circle, rgba(129,140,248,0.38), transparent 70%);
    animation:drift2 32s ease-in-out infinite;
  }
  .aurora span:nth-child(3){
    width:38vw;height:38vw;
    top:38%;left:58%;
    background:radial-gradient(circle, rgba(244,114,182,0.28), transparent 70%);
    animation:drift3 22s ease-in-out infinite;
  }

  @keyframes drift1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(6vw,8vh) scale(1.15);}
  }
  @keyframes drift2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-7vw,-6vh) scale(1.1);}
  }
  @keyframes drift3{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-5vw,7vh) scale(0.9);}
  }

  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(94,234,212,0.06), transparent 55%),
      radial-gradient(ellipse at 120% 120%, rgba(129,140,248,0.10), transparent 60%),
      radial-gradient(ellipse at -20% -10%, rgba(244,114,182,0.08), transparent 55%),
      radial-gradient(circle at center, transparent 40%, rgba(2,3,8,0.75) 100%);
    z-index:1;
  }

  .grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.035;
    z-index:2;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
  }

  .spotlight{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    mix-blend-mode:soft-light;
    background:radial-gradient(circle 420px at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.10), transparent 70%);
  }

  .scanline{
    position:fixed;
    left:0; right:0;
    top:-4%;
    height:14%;
    z-index:2;
    pointer-events:none;
    mix-blend-mode:overlay;
    background:linear-gradient(180deg, transparent, rgba(180,200,255,0.10) 45%, transparent 100%);
    animation:scanSweep 7s linear infinite;
  }
  @keyframes scanSweep{
    0%{ transform:translateY(-20%); }
    100%{ transform:translateY(820%); }
  }

  .orbit-ring{
    position:absolute;
    top:50%; left:50%;
    width:640px; height:640px;
    margin:-320px 0 0 -320px;
    border-radius:50%;
    border:1px dashed rgba(148,163,214,0.16);
    z-index:-2;
    pointer-events:none;
    animation:ringSpin 46s linear infinite;
  }
  .orbit-ring::before, .orbit-ring::after{
    content:'';
    position:absolute;
    width:6px;height:6px;
    border-radius:50%;
    top:50%; left:50%;
  }
  .orbit-ring::before{
    background:var(--accent);
    box-shadow:0 0 10px 2px rgba(94,234,212,0.8);
    transform:translate(314px,-3px);
  }
  .orbit-ring::after{
    background:var(--accent3);
    box-shadow:0 0 10px 2px rgba(244,114,182,0.75);
    transform:translate(-320px,-3px) rotate(160deg) translate(0,0);
  }
  .orbit-ring.inner{
    width:440px;height:440px;
    margin:-220px 0 0 -220px;
    animation:ringSpinReverse 34s linear infinite;
    border-color:rgba(148,163,214,0.12);
  }
  .orbit-ring.inner::before{
    transform:translate(214px,-3px);
  }
  .orbit-ring.inner::after{
    background:var(--accent2);
    box-shadow:0 0 10px 2px rgba(129,140,248,0.75);
    transform:translate(-220px,-3px);
  }

  @keyframes ringSpin{
    to{ transform:rotate(360deg); }
  }
  @keyframes ringSpinReverse{
    to{ transform:rotate(-360deg); }
  }

  @media (max-width:640px){
    .orbit-ring{ width:420px;height:420px;margin:-210px 0 0 -210px; }
    .orbit-ring::before{ transform:translate(204px,-3px); }
    .orbit-ring::after{ transform:translate(-210px,-3px); }
    .orbit-ring.inner{ width:300px;height:300px;margin:-150px 0 0 -150px; }
    .orbit-ring.inner::before{ transform:translate(144px,-3px); }
    .orbit-ring.inner::after{ transform:translate(-150px,-3px); }
  }

  .content{
    position:relative;
    z-index:3;
    text-align:center;
    padding:0 24px;
    max-width:900px;
    perspective:1200px;
  }

  .frame{
    position:relative;
    padding:52px 64px;
    transform-style:preserve-3d;
    transition:transform 0.2s ease-out;
    will-change:transform;
  }

  .rings{
    position:absolute;
    left:50%;top:44%;
    width:1px;height:1px;
    z-index:-1;
    pointer-events:none;
  }
  .rings span{
    position:absolute;
    left:0;top:0;
    width:10px;height:10px;
    margin:-5px;
    border-radius:50%;
    border:1px solid rgba(94,234,212,0.4);
    animation:ringPulse 5s ease-out infinite;
    opacity:0;
  }
  .rings span:nth-child(2){
    animation-delay:1.6s;
    border-color:rgba(129,140,248,0.35);
  }
  .rings span:nth-child(3){
    animation-delay:3.2s;
    border-color:rgba(244,114,182,0.3);
  }

  .corner{
    position:absolute;
    width:26px;height:26px;
    opacity:0;
    filter:drop-shadow(0 0 6px rgba(129,140,248,0.35));
    animation:cornerIn 0.9s cubic-bezier(.16,1,.3,1) 1.05s forwards;
  }
  .corner.tl{ top:0; left:0; border-top:1px solid rgba(148,163,214,0.55); border-left:1px solid rgba(148,163,214,0.55); }
  .corner.tr{ top:0; right:0; border-top:1px solid rgba(148,163,214,0.55); border-right:1px solid rgba(148,163,214,0.55); }
  .corner.bl{ bottom:0; left:0; border-bottom:1px solid rgba(148,163,214,0.55); border-left:1px solid rgba(148,163,214,0.55); }
  .corner.br{ bottom:0; right:0; border-bottom:1px solid rgba(148,163,214,0.55); border-right:1px solid rgba(148,163,214,0.55); }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--fg-dim);
    opacity:0;
    transform:translateY(10px);
    animation:fadeUp 1s cubic-bezier(.16,1,.3,1) 0.15s forwards;
    margin-bottom:28px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px 2px rgba(94,234,212,0.7);
    animation:pulse 2.4s ease-in-out infinite;
  }

  h1{
    font-size:clamp(3.2rem, 11vw, 8rem);
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:0.95;
    color:var(--fg);
    opacity:0;
    transform:translateY(24px);
    background:linear-gradient(100deg, #8b93ad 0%, #ffffff 20%, #d7ddee 40%, #8b93ad 60%, #ffffff 80%, #d7ddee 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    position:relative;
    filter:drop-shadow(0 0 40px rgba(129,140,248,0.15));
    animation:fadeUp 1.1s cubic-bezier(.16,1,.3,1) 0.35s forwards, wordmarkShine 7s ease-in-out 2s infinite;
  }
  h1 .accent-dot{
    position:relative;
    color:var(--accent);
    -webkit-text-fill-color:var(--accent);
  }
  h1 .accent-dot::after{
    content:'';
    position:absolute;
    top:38%;left:50%;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 6px 1px rgba(129,140,248,0.85);
    animation:orbit 3.6s linear infinite;
  }

  .subtitle{
    margin-top:22px;
    font-size:clamp(0.85rem, 2vw, 1.05rem);
    letter-spacing:0.08em;
    color:var(--fg-dim);
    font-weight:500;
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp 1s cubic-bezier(.16,1,.3,1) 0.6s forwards;
  }

  .divider{
    width:64px;height:1px;
    margin:36px auto;
    background:linear-gradient(90deg, transparent, var(--accent2), transparent);
    opacity:0;
    animation:fadeIn 1.2s ease 0.85s forwards;
  }

  .coming-soon{
    font-size:clamp(1.6rem, 4vw, 2.4rem);
    font-weight:300;
    letter-spacing:0.06em;
    color:transparent;
    background:linear-gradient(100deg,
      #aab2c8 0%, #aab2c8 40%,
      #ffffff 50%,
      #aab2c8 60%, #aab2c8 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    animation:shimmer 3.2s linear infinite, fadeUp 1s cubic-bezier(.16,1,.3,1) 1s forwards;
    opacity:0;
    transform:translateY(16px);
  }

  .flavor{
    margin-top:30px;
    font-size:clamp(0.82rem, 1.6vw, 0.95rem);
    color:var(--fg-dim);
    font-weight:400;
    letter-spacing:0.01em;
    line-height:1.7;
    opacity:0;
    transform:translateY(14px);
    animation:fadeUp 1s cubic-bezier(.16,1,.3,1) 1.2s forwards;
  }

  .ticker{
    margin-top:34px;
    font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--accent);
    opacity:0;
    animation:fadeIn 1s ease 1.6s forwards;
  }
  .ticker .cursor{
    display:inline-block;
    margin-left:2px;
    animation:blink 1s step-end infinite;
    color:var(--accent);
  }

  .footer{
    position:fixed;
    bottom:28px;
    left:0;right:0;
    text-align:center;
    z-index:3;
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#454d63;
    opacity:0;
    animation:fadeIn 1.2s ease 1.5s forwards;
  }

  @keyframes fadeUp{
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes fadeIn{
    to{opacity:1;}
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.4;transform:scale(0.7);}
  }
  @keyframes shimmer{
    to{background-position:-220% 0;}
  }
  @keyframes wordmarkShine{
    0%,100%{background-position:0% 0;}
    50%{background-position:100% 0;}
  }
  @keyframes orbit{
    from{transform:translate(-50%,-50%) rotate(0deg) translateX(15px);}
    to{transform:translate(-50%,-50%) rotate(360deg) translateX(15px);}
  }
  @keyframes ringPulse{
    0%{width:10px;height:10px;margin:-5px;opacity:0.7;}
    100%{width:820px;height:820px;margin:-410px;opacity:0;}
  }
  @keyframes cornerIn{
    to{opacity:1;}
  }
  @keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0;}
  }
  h1.glitch{
    animation:fadeUp 1.1s cubic-bezier(.16,1,.3,1) 0.35s forwards, wordmarkShine 7s ease-in-out 2s infinite, glitchShift 0.22s steps(2, end) 1;
    text-shadow:2px 0 rgba(94,234,212,0.5), -2px 0 rgba(244,114,182,0.5);
  }
  @keyframes glitchShift{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-2px,1px); }
    40%{ transform:translate(2px,-1px); }
    60%{ transform:translate(-1px,0); }
    80%{ transform:translate(1px,1px); }
    100%{ transform:translate(0,0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<canvas id="net"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="spotlight"></div>
<div class="scanline"></div>

<div class="content">
  <div class="frame" id="frame">
    <div class="orbit-ring"></div>
    <div class="orbit-ring inner"></div>
    <div class="rings"><span></span><span></span><span></span></div>
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="eyebrow"><span class="dot"></span>Northeastern University · D'Amore-McKim School of Business</div>
    <h1 id="wordmark">DASH<span class="accent-dot">.</span>Lab</h1>
    <div class="subtitle">DMSB AI Strategic Hub</div>
    <div class="divider"></div>
    <div class="coming-soon">Coming Soon</div>
    <p class="flavor">Exploring what's next in applied artificial intelligence.</p>
    <p class="ticker"><span id="ticker-text"></span><span class="cursor">_</span></p>
  </div>
</div>

<div class="footer">© 2026 DASH Lab — Northeastern University</div>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var w, h, dpr;
  var nodes = [];
  var stars = [];
  var pulses = [];
  var bursts = [];
  var mouse = { x: -9999, y: -9999, active:false };
  var t = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    initNodes();
    initStars();
  }

  function initNodes(){
    var area = w * h;
    var count = Math.max(34, Math.min(110, Math.floor(area / 18000)));
    nodes = [];
    for(var i=0;i<count;i++){
      nodes.push({
        x: Math.random()*w,
        y: Math.random()*h,
        vx: (Math.random()-0.5)*0.22,
        vy: (Math.random()-0.5)*0.22,
        r: Math.random()*1.7 + 0.6,
        tw: Math.random()*Math.PI*2
      });
    }
  }

  function initStars(){
    var area = w * h;
    var count = Math.max(60, Math.min(220, Math.floor(area / 9000)));
    stars = [];
    for(var i=0;i<count;i++){
      stars.push({
        x: Math.random()*w,
        y: Math.random()*h,
        r: Math.random()*1.1 + 0.2,
        phase: Math.random()*Math.PI*2,
        speed: 0.6 + Math.random()*1.2
      });
    }
  }

  var linkDist = 160;
  var colors = ['94,234,212','129,140,248','244,114,182'];

  function maybeSpawnPulse(a, b, dist){
    if(pulses.length > 14) return;
    if(Math.random() > 0.0025) return;
    pulses.push({ a:a, b:b, p:0, speed: 0.006 + Math.random()*0.006 });
  }

  function step(){
    t += 1;
    ctx.clearRect(0,0,w,h);

    // starfield twinkle
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var tw = 0.35 + 0.65 * (0.5 + 0.5*Math.sin(t*0.01*s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(220,228,245,' + (tw*0.5) + ')';
      ctx.fill();
    }

    // node motion + gentle mouse repulsion
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      n.x += n.vx;
      n.y += n.vy;

      if(mouse.active){
        var dx = n.x - mouse.x, dy = n.y - mouse.y;
        var d2 = dx*dx + dy*dy;
        var rad = 130;
        if(d2 < rad*rad){
          var d = Math.sqrt(d2) || 0.01;
          var force = (1 - d/rad) * 0.6;
          n.x += (dx/d) * force;
          n.y += (dy/d) * force;
        }
      }

      if(n.x < -20) n.x = w+20;
      if(n.x > w+20) n.x = -20;
      if(n.y < -20) n.y = h+20;
      if(n.y > h+20) n.y = -20;
    }

    // links
    for(var i=0;i<nodes.length;i++){
      for(var j=i+1;j<nodes.length;j++){
        var a = nodes[i], b = nodes[j];
        var dx = a.x-b.x, dy = a.y-b.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < linkDist){
          var op = (1 - dist/linkDist) * 0.18;
          ctx.strokeStyle = 'rgba(129,140,248,' + op + ')';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
          maybeSpawnPulse(a, b, dist);
        }
      }
    }

    // traveling data pulses along active links
    for(var i=pulses.length-1;i>=0;i--){
      var pu = pulses[i];
      pu.p += pu.speed;
      if(pu.p >= 1){ pulses.splice(i,1); continue; }
      var px = pu.a.x + (pu.b.x - pu.a.x) * pu.p;
      var py = pu.a.y + (pu.b.y - pu.a.y) * pu.p;
      var fade = Math.sin(pu.p * Math.PI);
      ctx.beginPath();
      ctx.arc(px, py, 1.8, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.85*fade) + ')';
      ctx.shadowColor = 'rgba(190,210,255,0.9)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // nodes with individual twinkle
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      var c = colors[i % colors.length];
      var glow = 0.45 + 0.4 * Math.sin(t*0.02 + n.tw);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(' + c + ',' + glow + ')';
      ctx.shadowColor = 'rgba(' + c + ',0.9)';
      ctx.shadowBlur = 7;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // click-spawned data bursts: expanding ring + radiating sparks
    for(var i=bursts.length-1;i>=0;i--){
      var bu = bursts[i];
      bu.p += 0.018;
      if(bu.p >= 1){ bursts.splice(i,1); continue; }
      var ringR = bu.p * 140;
      var ringFade = 1 - bu.p;
      ctx.beginPath();
      ctx.arc(bu.x, bu.y, ringR, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(' + bu.color + ',' + (ringFade*0.6) + ')';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      for(var k=0;k<bu.sparks.length;k++){
        var sp = bu.sparks[k];
        var sx = bu.x + Math.cos(sp.a) * sp.d * bu.p;
        var sy = bu.y + Math.sin(sp.a) * sp.d * bu.p;
        ctx.beginPath();
        ctx.arc(sx, sy, 1.4, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(' + bu.color + ',' + ringFade + ')';
        ctx.shadowColor = 'rgba(' + bu.color + ',0.9)';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    requestAnimationFrame(step);
  }

  function spawnBurst(x, y){
    var color = colors[Math.floor(Math.random()*colors.length)];
    var sparks = [];
    var count = 10;
    for(var i=0;i<count;i++){
      sparks.push({ a: (Math.PI*2/count)*i + Math.random()*0.3, d: 60 + Math.random()*70 });
    }
    bursts.push({ x:x, y:y, p:0, color:color, sparks:sparks });
    if(bursts.length > 6) bursts.shift();
  }

  window.addEventListener('click', function(e){
    spawnBurst(e.clientX, e.clientY);
  });

  var frame = document.getElementById('frame');
  var auroraEl = document.querySelector('.aurora');
  var root = document.documentElement;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;

    root.style.setProperty('--mx', (e.clientX/w*100) + '%');
    root.style.setProperty('--my', (e.clientY/h*100) + '%');

    if(!reduceMotion){
      var nx = (e.clientX / w - 0.5) * 2;
      var ny = (e.clientY / h - 0.5) * 2;
      if(frame) frame.style.transform = 'rotateX(' + (-ny*5) + 'deg) rotateY(' + (nx*5) + 'deg)';
      if(auroraEl) auroraEl.style.transform = 'translate(' + (-nx*16) + 'px,' + (-ny*16) + 'px)';
    }
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
    if(frame) frame.style.transform = 'rotateX(0deg) rotateY(0deg)';
    if(auroraEl) auroraEl.style.transform = 'translate(0,0)';
  });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]){
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, {passive:true});

  resize();
  requestAnimationFrame(step);

  // decrypt-style reveal for the wordmark
  var wordmark = document.getElementById('wordmark');
  if(wordmark){
    var finalHTML = wordmark.innerHTML;
    var finalText = wordmark.textContent;
    var scrambleChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&01';
    if(reduceMotion){
      wordmark.innerHTML = finalHTML;
    } else {
      setTimeout(function(){
        var revealed = 0;
        var frameCount = 0;
        var iv = setInterval(function(){
          var out = '';
          for(var i=0;i<finalText.length;i++){
            if(i < revealed || finalText[i] === '.'){ out += finalText[i]; }
            else { out += scrambleChars[Math.floor(Math.random()*scrambleChars.length)]; }
          }
          wordmark.textContent = out;
          frameCount++;
          if(frameCount % 2 === 0) revealed++;
          if(revealed > finalText.length){
            clearInterval(iv);
            wordmark.innerHTML = finalHTML;
            if(!reduceMotion) scheduleGlitch();
          }
        }, 45);
      }, 350);
    }
  }

  function scheduleGlitch(){
    var delay = 6000 + Math.random()*7000;
    setTimeout(function(){
      wordmark.classList.add('glitch');
      setTimeout(function(){ wordmark.classList.remove('glitch'); }, 240);
      scheduleGlitch();
    }, delay);
  }

  // typewriter status ticker
  var tickerEl = document.getElementById('ticker-text');
  if(tickerEl){
    var phrases = [
      'calibrating language models...',
      'mapping decision systems...',
      'indexing applied research...',
      'training the next experiment...'
    ];
    var phraseIdx = 0;
    function typeLoop(){
      var phrase = phrases[phraseIdx % phrases.length];
      var charIdx = 0;
      var typing = setInterval(function(){
        tickerEl.textContent = phrase.slice(0, charIdx);
        charIdx++;
        if(charIdx > phrase.length){
          clearInterval(typing);
          setTimeout(function(){
            var erasing = setInterval(function(){
              charIdx--;
              tickerEl.textContent = phrase.slice(0, charIdx);
              if(charIdx <= 0){
                clearInterval(erasing);
                phraseIdx++;
                setTimeout(typeLoop, 400);
              }
            }, 28);
          }, 1600);
        }
      }, 48);
    }
    setTimeout(typeLoop, 2200);
  }
})();
</script>
